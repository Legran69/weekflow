<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weekflow">
<title>Weekflow</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#101828;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:30px 16px}
button,input{font:inherit}button{cursor:pointer}.app{max-width:980px;margin:auto;background:#fff;border-radius:28px;padding:28px;min-height:calc(100vh - 60px);box-shadow:0 8px 35px rgba(15,23,42,.05)}
.auth{display:flex;gap:8px;padding:14px;border:1px solid #e7ebf1;background:#f8fafc;border-radius:18px;margin-bottom:22px}.auth input{flex:1;min-width:0}.input{border:1px solid #dfe5ec;background:#fff;border-radius:12px;padding:10px 12px;outline:none}.input:focus{border-color:#aab4c2;box-shadow:0 0 0 3px #eef1f5}
.btn{border:1px solid #dfe5ec;background:#fff;border-radius:12px;padding:10px 15px;color:#344054}.btn.dark{background:#111827;color:#fff;border-color:#111827}.btn:hover{background:#f5f7fa}.btn.dark:hover{background:#1f2937}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:42px}.tabs{display:flex;gap:4px;background:#f1f4f8;border-radius:14px;padding:4px}.tab{border:0;background:transparent;border-radius:11px;padding:9px 16px;color:#667085}.tab.active{background:#fff;color:#101828;box-shadow:0 1px 4px rgba(15,23,42,.08)}.brand{font-size:12px;letter-spacing:.18em;color:#c4ccd7}
h1{font-size:34px;line-height:1.1;margin:5px 0 8px;letter-spacing:-.03em}.eyebrow{font-size:14px;color:#94a3b8}.sub{color:#667085;margin:0}.page{display:none}.page.active{display:block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:48px 0 38px}.card{border:1px solid #edf0f4;background:#f8fafc;border-radius:18px;padding:18px}.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#98a2b3}.num{font-size:28px;font-weight:600;margin-top:9px}.muted{color:#98a2b3;font-size:14px}
.activity{border:1px solid #edf0f4;background:#f8fafc;border-radius:24px;padding:24px}.activity-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.activity h2{margin:0;font-size:20px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.dow{font-size:11px;color:#98a2b3;text-align:center;padding-bottom:3px}.day{aspect-ratio:1;border-radius:8px;background:#edf1f5;display:flex;align-items:center;justify-content:center;font-size:11px;color:#667085;position:relative}.day.l1{background:#cbd5e1;color:#111827}.day.l2{background:#64748b;color:#fff}.day.l3{background:#111827;color:#fff}.day.out{opacity:.3}
.footerstats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;border-top:1px solid #edf0f4;margin-top:24px;padding-top:22px}.task-list{border:1px solid #edf0f4;border-radius:18px;overflow:hidden;margin-top:20px}.task{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #f0f2f5}.task:last-child{border-bottom:0}.task .text{flex:1;text-align:left;background:none;border:0;padding:0;color:#101828}.task.done .text{text-decoration:line-through;color:#98a2b3}.delete{border:0;background:transparent;color:#98a2b3;font-size:20px}.add{display:flex;gap:8px;margin-top:12px}.add .input:first-child{flex:1}
.empty{padding:30px;text-align:center;color:#98a2b3}.message{font-size:12px;color:#98a2b3;margin-top:7px}
@media(max-width:700px){body{padding:8px}.app{padding:18px;border-radius:20px;min-height:calc(100vh - 16px)}.auth{flex-wrap:wrap}.auth input{flex-basis:45%}.stats{grid-template-columns:repeat(2,1fr);margin:34px 0 26px}.footerstats{grid-template-columns:repeat(2,1fr)}.nav{margin-bottom:32px}.brand{display:none}.add{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <div class="auth">
    <input id="email" class="input" type="email" placeholder="Email">
    <input id="password" class="input" type="password" placeholder="Password">
    <button id="signIn" class="btn dark">Sign in</button>
    <button id="signUp" class="btn">Create account</button>
    <div id="authMsg" class="message" style="width:100%"></div>
  </div>

  <nav class="nav">
    <div class="tabs">
      <button id="overviewTab" class="tab active">Overview</button>
      <button id="tasksTab" class="tab">Tasks</button>
    </div>
    <div class="brand">WEEKFLOW</div>
  </nav>

  <section id="overview" class="page active">
    <div class="eyebrow">Your productivity</div>
    <h1>Overview</h1>
    <p class="sub">A complete picture of your work.</p>

    <div class="stats">
      <div class="card"><div class="label">Today</div><div id="today" class="num">0</div><div class="muted">tasks</div></div>
      <div class="card"><div class="label">This week</div><div id="week" class="num">0</div><div class="muted">tasks</div></div>
      <div class="card"><div class="label">All time</div><div id="all" class="num">0</div><div class="muted">tasks</div></div>
      <div class="card"><div class="label">Streak</div><div id="streak" class="num">0</div><div class="muted">days</div></div>
    </div>

    <div class="activity">
      <div class="activity-head">
        <div><h2>Activity</h2><div class="muted">Tasks completed each day</div></div>
        <div style="display:flex;gap:6px"><button id="prevMonth" class="btn">←</button><button id="thisMonth" class="btn">Today</button><button id="nextMonth" class="btn">→</button></div>
      </div>
      <div id="monthTitle" class="muted" style="margin-bottom:12px"></div>
      <div id="calendar" class="calendar"></div>
      <div class="muted" style="text-align:right;margin-top:12px">Less&nbsp;&nbsp; · · · &nbsp;&nbsp;More</div>
    </div>

    <div class="footerstats">
      <div><div class="label">Completed</div><div id="completed" class="num" style="font-size:20px">0</div></div>
      <div><div class="label">Remaining</div><div id="remaining" class="num" style="font-size:20px">0</div></div>
      <div><div class="label">Best day</div><div id="best" class="num" style="font-size:20px">—</div></div>
      <div><div class="label">Average</div><div id="average" class="num" style="font-size:20px">0</div></div>
    </div>
  </section>

  <section id="tasksPage" class="page">
    <div class="eyebrow" id="taskDateLabel"></div>
    <h1>What’s up next?</h1>
    <p class="sub">A simple view of your week.</p>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:38px">
      <strong>Tasks</strong><button id="clearDone" class="btn">Clear done</button>
    </div>
    <div id="taskList" class="task-list"></div>
    <div class="add">
      <input id="taskInput" class="input" placeholder="Add a task…">
      <input id="taskDate" class="input" type="date">
      <button id="addTask" class="btn dark">Add</button>
    </div>
  </section>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const pad=n=>String(n).padStart(2,'0');
  const dateKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const today=new Date(); today.setHours(0,0,0,0);
  let month=new Date(today.getFullYear(),today.getMonth(),1);

  let tasks=[];
  try{tasks=JSON.parse(localStorage.getItem('weekflow_tasks')||'[]')}catch(e){tasks=[]}
  if(!Array.isArray(tasks))tasks=[];
  if(tasks.length===0){
    tasks=[
      {id:1,text:'Finish landing page',done:true,date:dateKey(today)},
      {id:2,text:'Review pull requests',done:true,date:dateKey(today)},
      {id:3,text:'30 min deep work',done:false,date:dateKey(today)},
      {id:4,text:'Plan next week',done:false,date:dateKey(today)}
    ];
    save();
  }
  function save(){localStorage.setItem('weekflow_tasks',JSON.stringify(tasks))}
  function show(which){
    $('overview').classList.toggle('active',which==='overview');
    $('tasksPage').classList.toggle('active',which==='tasks');
    $('overviewTab').classList.toggle('active',which==='overview');
    $('tasksTab').classList.toggle('active',which==='tasks');
  }
  function weekStart(d){const x=new Date(d);const n=x.getDay()||7;x.setDate(x.getDate()-n+1);x.setHours(0,0,0,0);return x}
  function render(){
    const todayKey=dateKey(today);
    const start=weekStart(today), end=new Date(start);end.setDate(end.getDate()+7);
    const doneToday=tasks.filter(t=>t.done&&t.date===todayKey).length;
    const doneWeek=tasks.filter(t=>t.done&&new Date(t.date+'T00:00:00')>=start&&new Date(t.date+'T00:00:00')<end).length;
    const doneAll=tasks.filter(t=>t.done).length;
    $('today').textContent=doneToday;$('week').textContent=doneWeek;$('all').textContent=doneAll;
    let s=0,d=new Date(today);while(tasks.some(t=>t.done&&t.date===dateKey(d))){s++;d.setDate(d.getDate()-1)}$('streak').textContent=s;
    $('completed').textContent=doneWeek;$('remaining').textContent=Math.max(0,tasks.filter(t=>new Date(t.date+'T00:00:00')>=start&&new Date(t.date+'T00:00:00')<end&&!t.done).length);$('average').textContent=(doneWeek/7).toFixed(1);

    $('taskDateLabel').textContent=today.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
    $('taskDate').value=todayKey;

    const list=$('taskList');list.innerHTML='';
    if(!tasks.length){list.innerHTML='<div class="empty">No tasks yet.</div>'}
    tasks.forEach(t=>{
      const row=document.createElement('div');row.className='task'+(t.done?' done':'');
      const check=document.createElement('input');check.type='checkbox';check.checked=t.done;
      const edit=document.createElement('button');edit.className='text';edit.textContent=t.text;
      const del=document.createElement('button');del.className='delete';del.textContent='×';
      const day=document.createElement('span');day.className='muted';day.textContent=t.date===todayKey?'today':'';
      row.append(check,edit,day,del);list.appendChild(row);
      check.onchange=()=>{t.done=check.checked;if(t.done)t.date=todayKey;save();render()};
      edit.onclick=()=>{const v=prompt('Edit task',t.text);if(v&&v.trim()){t.text=v.trim();save();render()}};
      del.onclick=()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render()};
    });

    const first=new Date(month.getFullYear(),month.getMonth(),1), startCal=new Date(first);
    const offset=(first.getDay()+6)%7;startCal.setDate(first.getDate()-offset);
    $('monthTitle').textContent=month.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    const cal=$('calendar');cal.innerHTML='';
    ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(x=>{const el=document.createElement('div');el.className='dow';el.textContent=x;cal.appendChild(el)});
    let best=0,bestDate=null;
    for(let i=0;i<42;i++){
      const d=new Date(startCal);d.setDate(startCal.getDate()+i);
      const count=tasks.filter(t=>t.done&&t.date===dateKey(d)).length;
      if(count>best){best=count;bestDate=d}
      const el=document.createElement('div');el.className='day'+(d.getMonth()!==month.getMonth()?' out':'')+(count===1?' l1':count===2?' l2':count>=3?' l3':'');
      el.textContent=d.getDate();el.title=count+' completed';cal.appendChild(el);
    }
    $('best').textContent=bestDate?bestDate.toLocaleDateString('en-US',{weekday:'short'}):'—';
  }

  $('overviewTab').onclick=()=>show('overview');
  $('tasksTab').onclick=()=>show('tasks');
  $('addTask').onclick=()=>{
    const text=$('taskInput').value.trim();if(!text)return;
    tasks.push({id:Date.now(),text,done:false,date:$('taskDate').value||dateKey(today)});
    $('taskInput').value='';save();render();
  };
  $('taskInput').onkeydown=e=>{if(e.key==='Enter')$('addTask').click()};
  $('clearDone').onclick=()=>{tasks=tasks.filter(t=>!t.done);save();render()};
  $('prevMonth').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render()};
  $('nextMonth').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render()};
  $('thisMonth').onclick=()=>{month=new Date(today.getFullYear(),today.getMonth(),1);render()};

  $('signIn').onclick=()=>{$('authMsg').textContent='Cloud login will be connected after the local app is stable.'};
  $('signUp').onclick=()=>{$('authMsg').textContent='Account creation will be connected after the local app is stable.'};

  render();
})();
</script>
</body>
</html>
